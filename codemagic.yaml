workflows:
  # main'ga har push bo'lganda APK avtomatik yig'iladi (MyFit bilan bir xil sxema).
  # APK doimiy IntizomAI kaliti bilan imzolanadi (android/app/intizomai-upload.p12),
  # shuning uchun yangi APK eskisining ustiga "Yangilash" sifatida o'rnatiladi.
  #
  # Codemagic → IntizomAi_ilova → Environment variables → guruh nomi: IntizomAi
  #   ANDROID_KEYSTORE_PASSWORD  — imzo kaliti paroli (Secure belgilang)
  #   API_BASE_URL               — ilova backend'i (IntizomAi_ilova_database) Railway manzili
  #   GOOGLE_SERVER_CLIENT_ID    — Google Cloud "Web application" OAuth client ID
  #   GOOGLE_IOS_CLIENT_ID       — Google Cloud "iOS" OAuth client ID
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      flutter: stable
      # Android Gradle Plugin 9.x lint vositasi Java 21 talab qiladi
      # (Java 17'da `List.removeLast()` topilmay build yiqiladi).
      java: 21
      groups:
        - IntizomAi
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Sozlamalarni tekshirish
        script: |
          if [ -z "$API_BASE_URL" ]; then
            echo "XATO: 'IntizomAi' guruhida API_BASE_URL yo'q (ilova backend'i manzili)."
            exit 1
          fi
          if [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "XATO: 'IntizomAi' guruhida GOOGLE_SERVER_CLIENT_ID yo'q — Google orqali kirish ishlamaydi."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "XATO: 'IntizomAi' guruhida ANDROID_KEYSTORE_PASSWORD yo'q."
            echo "Kalitsiz yig'ilgan APK eski ilova ustiga o'rnatilmaydi."
            exit 1
          fi
      - name: Paketlarni yuklash
        script: flutter pub get
      - name: Kod tahlili
        script: flutter analyze
      - name: Imzo kalitini ulash
        script: |
          umask 077
          printf 'storeFile=intizomai-upload.p12\nstoreType=pkcs12\nkeyAlias=intizomai\nstorePassword=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
      - name: APK yig'ish
        script: |
          flutter build apk --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID
      - name: Imzoni tekshirish
        script: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA-1 digest|SHA-256 digest"
          rm -f android/key.properties
      - name: APK nomini o'zgartirish (IntizomAI.apk)
        script: |
          set -euo pipefail
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/IntizomAI.apk
          ls -lh build/dist/IntizomAI.apk
    artifacts:
      - build/dist/IntizomAI.apk
    publishing:
      email:
        recipients:
          - a.xakimjonov@student.pdp.university
        notify:
          success: true
          failure: true

  # Google Play uchun AAB (Android App Bundle). Faqat qo'lda ishga tushiriladi:
  # Codemagic → IntizomAi_ilova → Start new build → "Android AAB (Google Play)".
  # AAB APK bilan bir xil doimiy kalit (intizomai-upload.p12) bilan imzolanadi —
  # Play Console'da u "upload key" bo'ladi, ilovani Google o'z kaliti bilan qayta imzolaydi.
  # versionCode = Codemagic build raqami ($BUILD_NUMBER): har yangi build kattaroq bo'ladi,
  # Play esa bir xil versionCode'ni ikkinchi marta qabul qilmaydi.
  android-aab:
    name: Android AAB (Google Play)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      flutter: stable
      java: 21
      groups:
        - IntizomAi
    scripts:
      - name: Sozlamalarni tekshirish
        script: |
          for v in API_BASE_URL GOOGLE_SERVER_CLIENT_ID ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "XATO: 'IntizomAi' guruhida $v yo'q."
              exit 1
            fi
          done
      - name: Paketlarni yuklash
        script: flutter pub get
      - name: Kod tahlili
        script: flutter analyze
      - name: Imzo kalitini ulash
        script: |
          umask 077
          printf 'storeFile=intizomai-upload.p12\nstoreType=pkcs12\nkeyAlias=intizomai\nstorePassword=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
      - name: AAB yig'ish
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID
      - name: Imzoni tekshirish
        script: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          # Debug kalit bilan imzolangan AAB'ni Play qabul qilmaydi — shu yerda to'xtatamiz.
          CERT=$(keytool -printcert -jarfile "$AAB")
          echo "$CERT" | grep -E "Owner:|SHA1:|SHA256:"
          if echo "$CERT" | grep -q "CN=Android Debug"; then
            echo "XATO: AAB debug kalit bilan imzolangan."
            exit 1
          fi
          rm -f android/key.properties
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - a.xakimjonov@student.pdp.university
        notify:
          success: true
          failure: true

  # iPhone'ga Sideloadly orqali o'rnatish uchun IMZOSIZ IPA (faqat qo'lda ishga tushiriladi).
  # Apple Developer obunasi, sertifikat, provisioning profile, App Store Connect yoki
  # TestFlight kerak emas: IPA'ni Sideloadly sizning bepul Apple ID'ingiz bilan imzolaydi.
  #
  # `triggering` bo'limi ataylab yo'q — main'ga push bo'lganda bu workflow ishlamaydi
  # (Android APK workflow'i avvalgidek alohida ishlayveradi).
  # Ishga tushirish: Codemagic → IntizomAi_ilova → Start new build → "iOS Sideload (unsigned IPA)".
  ios-sideload:
    name: iOS Sideload (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - IntizomAi
      vars:
        IPA_NAME: IntizomAI-unsigned.ipa
    scripts:
      - name: Sozlamalarni tekshirish
        script: |
          for v in API_BASE_URL GOOGLE_SERVER_CLIENT_ID GOOGLE_IOS_CLIENT_ID; do
            if [ -z "${!v}" ]; then
              echo "XATO: 'IntizomAi' guruhida $v yo'q."
              exit 1
            fi
          done
          flutter --version
          xcodebuild -version
          pod --version
      - name: Paketlarni yuklash
        script: flutter pub get
      - name: Google Sign-In URL sxemasini qo'shish (Info.plist)
        script: |
          set -euo pipefail
          # 1234-abc.apps.googleusercontent.com → com.googleusercontent.apps.1234-abc
          REVERSED=$(echo "$GOOGLE_IOS_CLIENT_ID" | awk -F. '{for(i=NF;i>0;i--) printf "%s%s",$i,(i>1?".":"")}')
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:1 string $REVERSED" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string $GOOGLE_IOS_CLIENT_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"
      - name: iOS loyihasini tayyorlash (Podfile, Swift Package'lar)
        script: |
          # Flutter iOS plaginlarini Swift Package Manager orqali ulaydi. SPM'ni
          # qo'llamaydigan plaginlar uchun (masalan flutter_secure_storage) Podfile
          # shu yerda avtomatik yaratiladi.
          flutter build ios --config-only --release --no-codesign \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID
      - name: CocoaPods bog'liqliklarini tekshirish
        script: |
          # Oldingi qadam (`--config-only`) `pod install`ni allaqachon bajargan;
          # bu yerda natija tekshiriladi va o'rnatilgan pod'lar ro'yxati chiqariladi.
          if [ -f ios/Podfile ]; then
            cd ios
            pod install
            test -d Pods || { echo "XATO: ios/Pods yaratilmadi"; exit 1; }
            echo "--- Podfile.lock (plaginlar) ---"
            sed -n '/^PODS:/,/^DEPENDENCIES:/p' Podfile.lock
          else
            echo "ios/Podfile yo'q — barcha plaginlar Swift Package Manager orqali ulangan."
          fi
      - name: IPA uchun ilovani yig'ish (imzosiz, Release)
        script: |
          flutter build ios --release --no-codesign \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID
      - name: Imzosiz IPA'ni qadoqlash (Payload/Runner.app)
        script: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "XATO: $APP topilmadi. Mavjud build/ios tarkibi:"
            find build/ios -maxdepth 3 -type d || true
            exit 1
          fi
          OUT="build/ios/ipa-unsigned"
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          # ditto — symlink va ruxsatlarni (Frameworks ichida) buzmasdan nusxa oladi.
          ditto "$APP" "$OUT/Payload/Runner.app"
          (cd "$OUT" && zip -qry "$IPA_NAME" Payload)
          rm -rf "$OUT/Payload"
          ls -lh "$OUT/$IPA_NAME"
      - name: IPA'ni tekshirish
        script: |
          set -euo pipefail
          IPA="build/ios/ipa-unsigned/$IPA_NAME"
          CHECK="$(mktemp -d)"
          unzip -q "$IPA" -d "$CHECK"
          RUNNER="$CHECK/Payload/Runner.app"
          test -f "$RUNNER/Runner" || { echo "XATO: Payload/Runner.app/Runner yo'q"; exit 1; }
          test -f "$RUNNER/Info.plist" || { echo "XATO: Info.plist yo'q"; exit 1; }
          test -d "$RUNNER/Frameworks/Flutter.framework" || { echo "XATO: Flutter.framework yo'q"; exit 1; }
          test -d "$RUNNER/Frameworks/App.framework" || { echo "XATO: App.framework yo'q"; exit 1; }
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER/Info.plist")"
          echo "Versiya:   $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER/Info.plist"))"
          echo "Min iOS:   $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$RUNNER/Info.plist")"
          echo "Arxitektura: $(lipo -archs "$RUNNER/Runner")"
          echo "Frameworks:"
          ls "$RUNNER/Frameworks"
          rm -rf "$CHECK"
    artifacts:
      - build/ios/ipa-unsigned/*.ipa
    publishing:
      email:
        recipients:
          - a.xakimjonov@student.pdp.university
        notify:
          success: true
          failure: true

  # App Store uchun imzolangan IPA. Faqat qo'lda ishga tushiriladi:
  # Codemagic → IntizomAi_ilova → Start new build → "iOS App Store".
  # Build App Store Connect'ga yuklanadi; Review'ga App Store Connect sahifasidan
  # qo'lda yuboriladi (birinchi versiyada skrinshot/tavsif u yerda to'ldiriladi).
  #
  # Kerak (bir marta sozlanadi):
  #   - Team settings → Integrations → Developer Portal: App Store Connect API kaliti,
  #     nomi `integrations.app_store_connect` dagi qiymat bilan bir xil bo'lsin.
  #   - Team settings → codemagic.yaml settings → Code signing identities:
  #     Apple Distribution sertifikati va uz.intizomai.intizomAi uchun App Store profili.
  #
  # HIDE_PURCHASES=true: Apple raqamli obunani tashqi to'lov (Paylov) orqali sotishga
  # ruxsat bermaydi (Guideline 3.1.1), shuning uchun iOS build'da sotuv tugmalari yashiriladi.
  ios-appstore:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: IntizomAi
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - IntizomAi
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uz.intizomai.intizomAi
    scripts:
      - name: Sozlamalarni tekshirish
        script: |
          for v in API_BASE_URL GOOGLE_SERVER_CLIENT_ID GOOGLE_IOS_CLIENT_ID; do
            if [ -z "${!v}" ]; then
              echo "XATO: 'IntizomAi' guruhida $v yo'q."
              exit 1
            fi
          done
      - name: Paketlarni yuklash
        script: flutter pub get
      - name: Google Sign-In URL sxemasini qo'shish (Info.plist)
        script: |
          set -euo pipefail
          REVERSED=$(echo "$GOOGLE_IOS_CLIENT_ID" | awk -F. '{for(i=NF;i>0;i--) printf "%s%s",$i,(i>1?".":"")}')
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:1 string $REVERSED" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string $GOOGLE_IOS_CLIENT_ID" "$PLIST"
      - name: iOS loyihasini tayyorlash (Podfile, Swift Package'lar)
        script: |
          flutter build ios --config-only --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID \
            --dart-define=HIDE_PURCHASES=true
      - name: Imzo profillarini Xcode loyihasiga ulash
        script: xcode-project use-profiles
      - name: IPA yig'ish (App Store)
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID \
            --dart-define=HIDE_PURCHASES=true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - a.xakimjonov@student.pdp.university
        notify:
          success: true
          failure: true
